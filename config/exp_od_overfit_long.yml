context:
  experiment_set: od
  experiment_name: overfit_long
  artifactory_root: ./artifactory
  execution_type: training
  verbose: 2

model:
  input_height: 200
  input_width: 320
  maximum_stride: 8
  backbone_spec:
    name: SmallFCNN
    strides: [2, 4, 8]
    width_base: 16
  neck_spec:
    name: AutoFusion
    output_stride: 4
    output_width: 64
  head_spec:
    name: OD
    peak_nms: 0.3

training:
  data:
    - name: cocodoom
      root: /data/Datasets/cocodoom
      subset: train-mini
      sampling_probability: 1.0
      transformations:
        - { name: image, stride: 1 }
        - { name: uniform_heatmap, stride: 4 }
        - { name: refinement, stride: 4 }
        - { name: box_wh, stride: 4 }
      kwargs:
        full: False
        split: run
        mini_size: 10   # 10 evenly-strided train images
  epochs: 300
  steps_per_epoch: 20
  batch_size: 10
  criteria_spec:
    losses:
      - name: focal
        feature: heatmap
        weight: 1.
      - name: mean_absolute_error
        feature: refinement
        weight: 10.
        sparse: True
      - name: mean_absolute_error
        feature: box_wh
        weight: 1.
        sparse: True

  optimizer_spec:
    name: Adam
  lr_schedule_spec:
    name: constant
    learning_rate: 0.001
  callbacks:
    - { name: LatestModelCheckpoint }
    - { name: ObjectMAP, checkpoint_best: True, every_n_epochs: 10 }
    - { name: CSVLogger }

evaluation:
  data:
    - name: cocodoom
      root: /data/Datasets/cocodoom
      subset: train-mini   # same 10 images: overfit check
      transformations:
        - { name: image, stride: 1 }
        - { name: uniform_heatmap, stride: 4 }
        - { name: refinement, stride: 4 }
        - { name: box_wh, stride: 4 }
      kwargs:
        full: False
        split: run
  detection_output_file : default

inference:
  data:
    - name: cocodoom
      root: /data/Datasets/cocodoom
      subset: val
      # Inference encodes images only: the decode chain comes from `training.data[0].transformations`.
      transformations:
        - { name: image, stride: 1 }
      kwargs:
        full: True
        split: run
        # sequence: run2/map01     # optional `run<N>/map<NN>` selector; omit to stream the whole split
        # frame_range: [0, 600]    # optional [start, end) frame indices inside the selected sequence

  visualization_mode: detection
  to_screen: True
  output_video_path: ""        # e.g. out.mp4; .mp4 (mp4v) is the default, .avi also works
  fps: 25
  total_num_frames: 400
  output_upscale_factor: 2
  score_threshold: 0.3         # detections below this score are not drawn
  realtime_playback: False     # sleep to the source fps when displaying on screen
